<!DOCTYPE html>
<html>
<head>
    <title>QA-TestHub - AI Assistant</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0 0 10px 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 18px;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h2 {
            color: #1f2937;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            margin-top: 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        pre {
            background: #f1f5f9;
            padding: 20px;
            white-space: pre-wrap;
            border-radius: 5px;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            background: #1f2937;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

<header>

    <h1>QA-TestHub</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="requirements.html">Requirements</a>
        <a href="test-cases.html">Test Cases</a>
        <a href="test-execution.html">Test Execution</a>
        <a href="bugs.html">Bugs</a>
        <a href="rtm.html">RTM</a>
        <a href="api-testing.html">API Testing</a>
        <a href="ai-assistant.html">AI Assistant</a>
    </nav>

</header>


<div class="container">

    <div class="card">

        <h2>AI-Assisted QA Assistant</h2>

        <p>
            Generate structured AI prompts for software testing activities.
        </p>

        <label>Select QA Activity</label>

        <select id="activity">

            <option value="testcases">
                Generate Test Cases
            </option>

            <option value="scenarios">
                Generate Test Scenarios
            </option>

            <option value="negative">
                Generate Negative Test Cases
            </option>

            <option value="boundary">
                Generate Boundary Test Cases
            </option>

            <option value="bug">
                Analyze a Bug
            </option>

        </select>


        <label>Requirement / Feature</label>

        <textarea
            id="requirement"
            placeholder="Example: User should be able to login using valid username and password."
        ></textarea>


        <button onclick="generatePrompt()">
            Generate AI Prompt
        </button>

    </div>


    <div class="card">

        <h2>Generated AI Prompt</h2>

        <pre id="output">
Your AI prompt will appear here.
        </pre>

        <button onclick="copyPrompt()">
            Copy Prompt
        </button>

    </div>

</div>


<footer>

    <p>QA-TestHub | AI-Assisted Software Testing</p>

</footer>


<script>

function generatePrompt() {

    let activity = document.getElementById("activity").value;

    let requirement = document.getElementById("requirement").value;

    if (requirement.trim() === "") {

        alert("Please enter a requirement or feature.");

        return;
    }

    let prompt = "";

    if (activity === "testcases") {

        prompt =
`Act as a Senior Software Tester.

Requirement:
${requirement}

Generate detailed manual test cases.

Include:
1. Test Case ID
2. Test Scenario
3. Preconditions
4. Test Steps
5. Test Data
6. Expected Result
7. Priority
8. Test Type

Cover positive, negative and validation scenarios.`;

    }


    if (activity === "scenarios") {

        prompt =
`Act as an experienced QA Engineer.

Requirement:
${requirement}

Identify all important end-to-end test scenarios.

Cover:
1. Positive scenarios
2. Negative scenarios
3. Validation scenarios
4. Boundary scenarios
5. Security-related scenarios
6. Usability scenarios

Present the result in a structured table.`;

    }


    if (activity === "negative") {

        prompt =
`Act as a Senior QA Engineer.

Requirement:
${requirement}

Generate negative test cases.

Focus on:
1. Invalid input
2. Empty input
3. Incorrect data
4. Special characters
5. Boundary violations
6. Duplicate data
7. Unauthorized actions

Provide test steps and expected results.`;

    }


    if (activity === "boundary") {

        prompt =
`Act as a Software Testing Expert.

Requirement:
${requirement}

Identify boundary value test cases.

Provide:
1. Minimum value
2. Minimum-1
3. Minimum+1
4. Maximum value
5. Maximum-1
6. Maximum+1

Explain the expected result for each case.`;

    }


    if (activity === "bug") {

        prompt =
`Act as a Senior QA Engineer.

Analyze the following bug information:

${requirement}

Provide:
1. Possible root cause
2. Severity
3. Priority
4. Reproduction analysis
5. Expected behavior
6. Actual behavior
7. Suggested fix
8. Regression testing recommendations

Do not assume information that is not provided.`;

    }


    document.getElementById("output").textContent = prompt;

}


function copyPrompt() {

    let text = document.getElementById("output").textContent;

    navigator.clipboard.writeText(text);

    alert("AI Prompt copied successfully!");

}

</script>

</body>
</html>
