<!DOCTYPE html>
<html>
<head>

    <title>Requirements - QA-TestHub</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #172033;
            color: white;
            padding: 20px 30px;
        }

        header h1 {
            margin: 0 0 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
            font-size: 14px;
        }

        .container {
            padding: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px #ddd;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        button {
            margin-top: 18px;
            padding: 11px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 11px;
            text-align: left;
        }

        th {
            background: #172033;
            color: white;
        }

        .high {
            color: red;
            font-weight: bold;
        }

        .medium {
            color: orange;
            font-weight: bold;
        }

        .low {
            color: green;
            font-weight: bold;
        }

        @media(max-width:700px) {

            .container {
                padding: 15px;
            }

            table {
                font-size: 12px;
            }

        }

    </style>

</head>

<body>

<header>

    <h1>QA-TestHub</h1>

    <nav>

        <a href="index.html">Home</a>

        <a href="dashboard.html">Dashboard</a>

        <a href="requirements.html">Requirements</a>

        <a href="test-cases.html">Test Cases</a>

        <a href="test-execution.html">Execution</a>

        <a href="bugs.html">Bugs</a>

        <a href="rtm.html">RTM</a>

    </nav>

</header>


<div class="container">

    <h2>Requirements Management</h2>


    <div class="card">

        <h3>Add Requirement</h3>


        <label>Requirement Title</label>

        <input
            id="title"
            type="text"
            placeholder="Enter requirement title">


        <label>Description</label>

        <textarea
            id="description"
            placeholder="Enter requirement description">
        </textarea>


        <label>Priority</label>

        <select id="priority">

            <option value="High">High</option>

            <option value="Medium">Medium</option>

            <option value="Low">Low</option>

        </select>


        <button onclick="saveRequirement()">
            Add Requirement
        </button>

    </div>


    <div class="card">

        <h3>Requirements List</h3>

        <table>

            <thead>

                <tr>

                    <th>Requirement ID</th>

                    <th>Title</th>

                    <th>Description</th>

                    <th>Priority</th>

                </tr>

            </thead>

            <tbody id="requirementBody">

            </tbody>

        </table>

    </div>

</div>


<script>

let requirements =
    JSON.parse(localStorage.getItem("qaRequirements")) || [];


function saveRequirement() {

    let title =
        document.getElementById("title").value.trim();

    let description =
        document.getElementById("description").value.trim();

    let priority =
        document.getElementById("priority").value;


    if (title === "" || description === "") {

        alert("Please fill all fields");

        return;

    }


    let number =
        requirements.length + 1;


    let requirementId =
        "REQ-" + String(number).padStart(3, "0");


    let requirement = {

        id: requirementId,

        title: title,

        description: description,

        priority: priority

    };


    requirements.push(requirement);


    localStorage.setItem(
        "qaRequirements",
        JSON.stringify(requirements)
    );


    alert("Requirement added successfully!");


    document.getElementById("title").value = "";

    document.getElementById("description").value = "";


    displayRequirements();

}


function displayRequirements() {

    let body =
        document.getElementById("requirementBody");


    body.innerHTML = "";


    requirements.forEach(function(req) {

        body.innerHTML += `

        <tr>

            <td>${req.id}</td>

            <td>${req.title}</td>

            <td>${req.description}</td>

            <td class="${req.priority.toLowerCase()}">
                ${req.priority}
            </td>

        </tr>

        `;

    });

}


displayRequirements();

</script>

</body>
</html>
