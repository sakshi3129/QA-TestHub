<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QA-TestHub - Test Cases</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 18px 40px;
        }

        header h1 {
            margin: 0;
        }

        nav {
            margin-top: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        h2 {
            color: #1f2937;
        }

        .form-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-box h2 {
            margin-top: 0;
        }

        input,
        select {
            padding: 10px;
            margin: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .form-box input {
            width: calc(33% - 20px);
        }

        .form-box select {
            width: calc(30% - 20px);
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            margin: 6px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .filter-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .filter-box input {
            width: 45%;
        }

        .filter-box select {
            width: 20%;
        }

        .table-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1f2937;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f1f5f9;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            background: #1f2937;
            color: white;
        }

        @media (max-width: 768px) {

            .form-box input,
            .form-box select,
            .filter-box input,
            .filter-box select {
                width: 100%;
                margin: 6px 0;
            }

            header {
                padding: 18px 20px;
            }

            .container {
                width: 95%;
            }
        }

    </style>

</head>

<body>

    <header>

        <h1>QA-TestHub</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="requirements.html">Requirements</a>
            <a href="test-cases.html">Test Cases</a>
            <a href="test-execution.html">Test Execution</a>
            <a href="bugs.html">Bugs</a>
            <a href="rtm.html">RTM</a>
            <a href="api-testing.html">API Testing</a>
            <a href="ai-assistant.html">AI Assistant</a>
            <a href="bug-analyzer.html">Bug Analyzer</a>
        </nav>

    </header>


    <div class="container">

        <h2>Test Case Management</h2>


        <!-- ADD TEST CASE FORM -->

        <div class="form-box">

            <h2>Add New Test Case</h2>

            <input
                type="text"
                id="newId"
                placeholder="Test Case ID"
            >

            <input
                type="text"
                id="newReq"
                placeholder="Requirement"
            >

            <input
                type="text"
                id="newScenario"
                placeholder="Test Scenario"
            >

            <select id="newType">

                <option value="">
                    Select Test Type
                </option>

                <option value="Functional">
                    Functional
                </option>

                <option value="Negative">
                    Negative
                </option>

                <option value="Validation">
                    Validation
                </option>

                <option value="Smoke">
                    Smoke
                </option>

                <option value="Boundary">
                    Boundary
                </option>

                <option value="Regression">
                    Regression
                </option>

            </select>


            <select id="newPriority">

                <option value="">
                    Select Priority
                </option>

                <option value="High">
                    High
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="Low">
                    Low
                </option>

            </select>


            <input
                type="text"
                id="newExpected"
                placeholder="Expected Result"
            >

            <br>

            <button onclick="addTestCase()">
                Add Test Case
            </button>

        </div>


        <!-- SEARCH AND FILTER -->

        <div class="filter-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search test cases..."
                onkeyup="filterTestCases()"
            >


            <select
                id="typeFilter"
                onchange="filterTestCases()"
            >

                <option value="">
                    All Test Types
                </option>

                <option value="Functional">
                    Functional
                </option>

                <option value="Negative">
                    Negative
                </option>

                <option value="Validation">
                    Validation
                </option>

                <option value="Smoke">
                    Smoke
                </option>

                <option value="Boundary">
                    Boundary
                </option>

                <option value="Regression">
                    Regression
                </option>

            </select>


            <select
                id="statusFilter"
                onchange="filterTestCases()"
            >

                <option value="">
                    All Status
                </option>

                <option value="Pass">
                    Pass
                </option>

                <option value="Fail">
                    Fail
                </option>

                <option value="Blocked">
                    Blocked
                </option>

                <option value="Not Executed">
                    Not Executed
                </option>

            </select>

        </div>


        <!-- TEST CASE TABLE -->

        <div class="table-box">

            <table id="testCaseTable">

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Requirement</th>
                        <th>Scenario</th>
                        <th>Test Type</th>
                        <th>Priority</th>
                        <th>Expected Result</th>
                        <th>Status</th>

                    </tr>

                </thead>


                <tbody id="testCaseBody">

                </tbody>

            </table>

        </div>

    </div>


    <footer>

        <p>QA-TestHub | Software Testing Portfolio Project</p>

    </footer>


    <script>

        let defaultTestCases = [

            {
                id: "TC-001",
                req: "REQ-001",
                scenario: "Valid Login",
                type: "Functional",
                priority: "High",
                expected: "User should login successfully",
                status: "Pass"
            },

            {
                id: "TC-002",
                req: "REQ-001",
                scenario: "Invalid Password",
                type: "Negative",
                priority: "High",
                expected: "Error message should be displayed",
                status: "Pass"
            },

            {
                id: "TC-003",
                req: "REQ-001",
                scenario: "Empty Username",
                type: "Validation",
                priority: "Medium",
                expected: "Username validation message should be displayed",
                status: "Fail"
            },

            {
                id: "TC-004",
                req: "REQ-001",
                scenario: "Logout",
                type: "Functional",
                priority: "High",
                expected: "User should be logged out successfully",
                status: "Pass"
            },

            {
                id: "TC-005",
                req: "REQ-001",
                scenario: "Password Masking",
                type: "Smoke",
                priority: "Medium",
                expected: "Password should be hidden",
                status: "Blocked"
            },

            {
                id: "TC-006",
                req: "REQ-002",
                scenario: "Valid Registration",
                type: "Functional",
                priority: "High",
                expected: "User should be registered successfully",
                status: "Pass"
            },

            {
                id: "TC-007",
                req: "REQ-002",
                scenario: "Existing Email",
                type: "Negative",
                priority: "High",
                expected: "Existing email error should be displayed",
                status: "Pass"
            },

            {
                id: "TC-008",
                req: "REQ-002",
                scenario: "Password Mismatch",
                type: "Validation",
                priority: "Medium",
                expected: "Password mismatch message should be displayed",
                status: "Fail"
            },

            {
                id: "TC-009",
                req: "REQ-003",
                scenario: "Forgot Password",
                type: "Functional",
                priority: "Medium",
                expected: "Password reset option should be available",
                status: "Pass"
            },

            {
                id: "TC-010",
                req: "REQ-001",
                scenario: "Maximum Password Length",
                type: "Boundary",
                priority: "Medium",
                expected: "System should handle maximum password length",
                status: "Blocked"
            }

        ];


        let storedTestCases =
            JSON.parse(
                localStorage.getItem("qaTestCases")
            );


        let testCases =
            storedTestCases || defaultTestCases;


        function displayTestCases(data) {

            let body =
                document.getElementById("testCaseBody");

            body.innerHTML = "";


            data.forEach(function(tc) {

                body.innerHTML += `

                    <tr>

                        <td>${tc.id}</td>

                        <td>${tc.req}</td>

                        <td>${tc.scenario}</td>

                        <td>${tc.type}</td>

                        <td>${tc.priority}</td>

                        <td>${tc.expected}</td>

                        <td>${tc.status}</td>

                    </tr>

                `;

            });

        }


        function addTestCase() {

            let id =
                document.getElementById("newId").value.trim();

            let req =
                document.getElementById("newReq").value.trim();

            let scenario =
                document.getElementById("newScenario").value.trim();

            let type =
                document.getElementById("newType").value;

            let priority =
                document.getElementById("newPriority").value;

            let expected =
                document.getElementById("newExpected").value.trim();


            if (
                id === "" ||
                req === "" ||
                scenario === "" ||
                type === "" ||
                priority === "" ||
                expected === ""
            ) {

                alert("Please fill all fields.");

                return;

            }


            let existingCase =
                testCases.some(function(tc) {

                    return tc.id.toLowerCase() === id.toLowerCase();

                });


            if (existingCase) {

                alert("Test Case ID already exists.");

                return;

            }


            let newTestCase = {

                id: id,
                req: req,
                scenario: scenario,
                type: type,
                priority: priority,
                expected: expected,
                status: "Not Executed"

            };


            testCases.push(newTestCase);


            localStorage.setItem(
                "qaTestCases",
                JSON.stringify(testCases)
            );


            displayTestCases(testCases);


            document.getElementById("newId").value = "";
            document.getElementById("newReq").value = "";
            document.getElementById("newScenario").value = "";
            document.getElementById("newType").value = "";
            document.getElementById("newPriority").value = "";
            document.getElementById("newExpected").value = "";


            alert("Test Case added successfully.");

        }


        function filterTestCases() {

            let search =
                document.getElementById("searchInput")
                    .value
                    .toLowerCase();


            let type =
                document.getElementById("typeFilter").value;


            let status =
                document.getElementById("statusFilter").value;


            let filtered =
                testCases.filter(function(tc) {

                    let searchMatch =
                        tc.id.toLowerCase().includes(search) ||
                        tc.req.toLowerCase().includes(search) ||
                        tc.scenario.toLowerCase().includes(search) ||
                        tc.expected.toLowerCase().includes(search);


                    let typeMatch =
                        type === "" ||
                        tc.type === type;


                    let statusMatch =
                        status === "" ||
                        tc.status === status;


                    return (
                        searchMatch &&
                        typeMatch &&
                        statusMatch
                    );

                });


            displayTestCases(filtered);

        }


        displayTestCases(testCases);

    </script>

</body>

</html>
